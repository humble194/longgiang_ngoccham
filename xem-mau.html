<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Xem các mẫu thiệp</title>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;🗂️&lt;/text&gt;&lt;/svg&gt;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
  <style>
    /* Trang nội bộ để so sánh các mẫu thiệp: danh sách bên trái, khung điện thoại bên phải.
       Trên điện thoại, bấm vào mẫu sẽ mở thẳng trang đó. */
    :root {
      --bg: #ECEDEA;
      --panel: #FFFFFF;
      --ink: #1F2320;
      --dim: #6B706B;
      --line: #D6D8D3;
      --sel: #24413A;
      --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
    h1 { font: 600 1.25rem/1.3 var(--body); margin: 0; }
    .head p { margin: 4px 0 0; color: var(--dim); font-size: .88rem; }
    .guest-field { margin-top: 14px; display: grid; gap: 6px; }
    .guest-field label { font: 500 .82rem/1 var(--body); color: var(--dim); }
    .guest-field input {
      font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #FAFAF8; width: 100%;
    }
    .guest-field input:focus { outline: 2px solid var(--sel); outline-offset: -1px; border-color: transparent; }

    ol { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
    li + li { margin-top: 2px; }
    .item {
      display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
      padding: 10px 12px; border-radius: 10px; text-decoration: none;
    }
    .item:hover { background: #F3F4F1; }
    .item[aria-current="true"] { background: var(--sel); color: #fff; }
    .item[aria-current="true"] .desc, .item[aria-current="true"] .file { color: rgba(255,255,255,.75); }
    .sw { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .sw span:first-child { grid-row: span 2; }
    .name { font-weight: 600; }
    .desc { font-size: .84rem; color: var(--dim); }
    .file { font-size: .76rem; color: var(--dim); margin-top: 2px; }
    .tag { display: inline-block; font: 500 .7rem/1 var(--body); padding: 3px 6px; border-radius: 4px; background: #E3EAE6; color: var(--sel); margin-left: 6px; vertical-align: 2px; }
    .item[aria-current="true"] .tag { background: rgba(255,255,255,.18); color: #fff; }

    .viewer { display: flex; flex-direction: column; align-items: center; min-height: 0; padding: 18px 24px 24px; gap: 14px; }
    .bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 760px; }
    .bar .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar button, .bar a {
      font: 500 .85rem/1 var(--body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .bar button:hover, .bar a:hover { border-color: #AEB2AC; }
    .sizes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .sizes button { border: 0; border-radius: 0; }
    .sizes button + button { border-left: 1px solid var(--line); }
    .sizes button[aria-pressed="true"] { background: var(--sel); color: #fff; }

    .stage { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
    .phone {
      width: var(--w, 414px); height: min(var(--h, 868px), 100%);
      background: #111; border-radius: 44px; padding: 12px;
      box-shadow: 0 30px 60px -30px rgba(0,0,0,.45);
      transition: width .25s ease;
    }
    .phone.desk { border-radius: 14px; padding: 8px; }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 32px; background: #fff; display: block; }
    .phone.desk iframe { border-radius: 8px; }
    .keys { font-size: .8rem; color: var(--dim); }
    kbd { font: 500 .75rem/1 var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--panel); }

    /* Điện thoại: chỉ hiện danh sách, bấm là mở trang */
    @media (max-width: 860px) {
      .app { display: block; height: auto; }
      aside { border-right: 0; min-height: 100vh; }
      .viewer { display: none; }
      ol { overflow: visible; padding: 8px max(8px, env(safe-area-inset-left, 0px)) 32px; }
    }
    @media (prefers-reduced-motion: reduce) { .phone { transition: none; } }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1>Các mẫu thiệp</h1>
      <p>Chọn một mẫu để xem trong khung điện thoại.</p>
      <div class="guest-field">
        <label for="guest">Tên khách để xem thử</label>
        <input id="guest" type="text" value="Anh Minh" maxlength="60" autocomplete="off">
      </div>
    </div>
    <ol id="list"></ol>
  </aside>

  <div class="viewer">
    <div class="bar">
      <button type="button" id="prev" aria-label="Mẫu trước">‹</button>
      <button type="button" id="next" aria-label="Mẫu sau">›</button>
      <span class="title" id="title"></span>
      <div class="sizes" role="group" aria-label="Kích thước khung">
        <button type="button" data-size="phone" aria-pressed="true">Điện thoại</button>
        <button type="button" data-size="desk" aria-pressed="false">Máy tính</button>
      </div>
      <button type="button" id="reload">Xem lại hiệu ứng</button>
      <a id="open" target="_blank" rel="noopener">Mở tab mới</a>
    </div>
    <div class="stage" id="stage">
      <div class="phone" id="phone"><iframe id="frame" title="Xem trước mẫu thiệp"></iframe></div>
    </div>
    <p class="keys">Dùng <kbd>←</kbd> <kbd>→</kbd> để chuyển mẫu</p>
  </div>
</div>

<script>
  // Thêm mẫu mới: thêm một dòng vào đây
  var SAMPLES = [
    { file: "index.html", name: "Bản đang dùng", desc: "Trang chính hiện tại", tag: "Chính", colors: ["#0F1A14", "#C08A4E", "#EDE8D8"] },
    { file: "test.html", name: "Đêm tiệc ánh nến", desc: "Nền nâu ấm, điểm nhấn vàng nến", colors: ["#15100B", "#D3A65E", "#F4EADA"] },
    { file: "test1.html", name: "Ánh nến tím", desc: "Biến thể tím của đêm tiệc ánh nến", colors: ["#140F1C", "#9D8FC2", "#F4EADA"] },
    { file: "test-mau1-ngoc-luc-bao.html", name: "Ngọc lục bảo & đồng", desc: "Vườn đêm, điểm nhấn đồng", colors: ["#0F1A14", "#C08A4E", "#A9B3A0"] },
    { file: "test-mau2-lich-bloc.html", name: "Tờ lịch ngày 12", desc: "Xé tờ lịch 11 để lộ tờ 12", colors: ["#FBF8F1", "#C8102E", "#1F4E9C"] },
    { file: "test-mau3-dong-ho.html", name: "Tranh Đông Hồ", desc: "Giấy điệp, màu in lệch tay", colors: ["#EBDDBF", "#B5322A", "#E8B739"] },
    { file: "test-mau4-son-mai.html", name: "Sơn mài", desc: "Đen then, vàng dát, khảm trứng", colors: ["#14110F", "#D4A63A", "#9E2B1F"] },
    { file: "test-mau5-doi-che.html", name: "Đồi chè Phú Thọ", desc: "Đường đồng mức, sương tan", colors: ["#EEF1EA", "#3F5B2A", "#8DB255"] },
    { file: "test-mau6-album-phim.html", name: "Album rửa phim", desc: "Bìa nhung, góc dán, bút bi", colors: ["#2F3B2B", "#E9E2D0", "#FF7A1A"] },
    { file: "test-mau7-phong-bi-do.html", name: "Phong bì đỏ", desc: "Mở phong bì có con dấu Hỷ", colors: ["#A3121F", "#C9A24B", "#F7EFE6"] }
  ];

  var list = document.getElementById("list");
  var frame = document.getElementById("frame");
  var guestInput = document.getElementById("guest");
  var current = 0;
  var wide = window.matchMedia("(min-width: 861px)");

  function url(i) {
    var g = guestInput.value.trim();
    return SAMPLES[i].file + (g ? "?to=" + encodeURIComponent(g) : "");
  }

  SAMPLES.forEach(function (s, i) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "item";
    a.href = s.file;
    a.dataset.i = i;
    a.innerHTML =
      '<span class="sw" aria-hidden="true">' + s.colors.map(function (c) { return '<span style="background:' + c + '"></span>'; }).join("") + "</span>" +
      '<span><span class="name"></span>' + (s.tag ? '<span class="tag"></span>' : "") +
      '<span class="desc" style="display:block"></span><span class="file" style="display:block"></span></span>';
    a.querySelector(".name").textContent = s.name;
    if (s.tag) a.querySelector(".tag").textContent = s.tag;
    a.querySelector(".desc").textContent = s.desc;
    a.querySelector(".file").textContent = s.file;
    a.addEventListener("click", function (e) {
      if (!wide.matches) { a.href = url(i); return; } // điện thoại: mở thẳng trang
      e.preventDefault();
      show(i);
    });
    li.appendChild(a);
    list.appendChild(li);
  });

  function show(i) {
    current = (i + SAMPLES.length) % SAMPLES.length;
    var u = url(current);
    frame.src = u;
    document.getElementById("open").href = u;
    document.getElementById("title").textContent = SAMPLES[current].name;
    list.querySelectorAll(".item").forEach(function (a) {
      a.setAttribute("aria-current", String(+a.dataset.i === current));
    });
    list.querySelector('[data-i="' + current + '"]').scrollIntoView({ block: "nearest" });
    try { history.replaceState(null, "", "#" + SAMPLES[current].file); } catch (e) {}
  }

  document.getElementById("prev").addEventListener("click", function () { show(current - 1); });
  document.getElementById("next").addEventListener("click", function () { show(current + 1); });
  document.getElementById("reload").addEventListener("click", function () { frame.src = url(current); });
  guestInput.addEventListener("change", function () { show(current); });

  document.querySelectorAll("[data-size]").forEach(function (b) {
    b.addEventListener("click", function () {
      var desk = b.dataset.size === "desk";
      var phone = document.getElementById("phone");
      phone.classList.toggle("desk", desk);
      phone.style.setProperty("--w", desk ? "min(1100px, 100%)" : "414px");
      phone.style.setProperty("--h", desk ? "100%" : "868px");
      document.querySelectorAll("[data-size]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });

  document.addEventListener("keydown", function (e) {
    if (e.target === guestInput) return;
    if (e.key === "ArrowRight") show(current + 1);
    if (e.key === "ArrowLeft") show(current - 1);
  });

  // Mở lại đúng mẫu đang xem khi tải lại trang (theo #tên-file)
  var start = SAMPLES.findIndex(function (s) { return "#" + s.file === location.hash; });
  if (wide.matches) show(start >= 0 ? start : 0);
</script>
</body>
</html>
